services:
  asl-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: anikesh09/asl-sign-ai:latest
    container_name: asl-sign-ai
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - TF_CPP_MIN_LOG_LEVEL=3
    volumes:
      # Persist user vocabulary, corrections, and prediction logs on host
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
